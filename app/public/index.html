<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenLayer Contract Scorer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --raised: #293548;
      --border: #334155;
      --primary: #6366f1;
      --primary-dim: rgba(99,102,241,.12);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --good: #22c55e;
      --warn: #eab308;
      --bad: #ef4444;
      --mono: 'Cascadia Code','Fira Code','Consolas',monospace;
      --sans: 'Segoe UI',system-ui,-apple-system,sans-serif;
      --r: 8px;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.5; min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; gap: 12px; }
    .logo { width: 34px; height: 34px; background: var(--primary); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    header h1 { font-size: 16px; font-weight: 600; }
    header p { font-size: 12px; color: var(--muted); }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .main { max-width: 860px; margin: 32px auto; padding: 0 24px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
    .card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 14px; }
    textarea { width: 100%; height: 280px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; color: var(--text); font-family: var(--mono); font-size: 12.5px; line-height: 1.65; resize: vertical; outline: none; }
    textarea:focus { border-color: var(--primary); }
    .toolbar { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--r); border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:not(:disabled):hover { background: #818cf8; }
    .btn-ghost { background: var(--raised); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:not(:disabled):hover { background: var(--border); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .spinner { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .65s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .notice { padding: 12px 16px; border-radius: var(--r); font-size: 13px; display: flex; align-items: flex-start; gap: 10px; }
    .notice-err { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25); color: #fca5a5; }
    .log { background: #080f1a; border: 1px solid var(--border); border-radius: var(--r); padding: 14px; font-family: var(--mono); font-size: 12px; line-height: 1.75; max-height: 220px; overflow-y: auto; color: #7dd3fc; }
    .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .score-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 16px 14px; }
    .score-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
    .score-num { font-size: 42px; font-weight: 700; line-height: 1; margin-bottom: 10px; }
    .score-num.good { color: var(--good); }
    .score-num.mid { color: var(--warn); }
    .score-num.bad { color: var(--bad); }
    .score-bar-track { height: 4px; background: var(--raised); border-radius: 99px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 99px; transition: width .6s ease; }
    .score-bar-fill.good { background: var(--good); }
    .score-bar-fill.mid { background: var(--warn); }
    .score-bar-fill.bad { background: var(--bad); }
    .summary-text { font-size: 13px; color: var(--muted); margin-bottom: 16px; font-style: italic; padding: 8px 12px; background: var(--bg); border-radius: var(--r); border-left: 3px solid var(--primary); }
    .verdict { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; letter-spacing: .04em; margin-bottom: 20px; }
    .verdict.good { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
    .verdict.mid { background: rgba(234,179,8,.12); color: #fde68a; border: 1px solid rgba(234,179,8,.25); }
    .verdict.bad { background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.25); }
    .vuln-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .vuln-counts { display: flex; gap: 8px; }
    .vuln-count-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
    .vuln-count-badge.critical { background: rgba(239,68,68,.15); color: #fca5a5; }
    .vuln-count-badge.medium { background: rgba(234,179,8,.15); color: #fde68a; }
    .vuln-count-badge.low { background: rgba(34,197,94,.15); color: #bbf7d0; }
    .vuln-list { display: flex; flex-direction: column; gap: 6px; }
    .vuln-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: var(--bg); border-radius: var(--r); border-left: 3px solid transparent; }
    .vuln-item.critical { border-color: var(--bad); }
    .vuln-item.medium { border-color: var(--warn); }
    .vuln-item.low { border-color: var(--good); }
    .vuln-badge { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
    .critical .vuln-badge { background: rgba(239,68,68,.18); color: #fca5a5; }
    .medium .vuln-badge { background: rgba(234,179,8,.18); color: #fde68a; }
    .low .vuln-badge { background: rgba(34,197,94,.18); color: #bbf7d0; }
    .vuln-desc { font-size: 13px; line-height: 1.4; }
    .no-vulns { color: var(--good); font-size: 13px; display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(34,197,94,.06); border-radius: var(--r); border: 1px solid rgba(34,197,94,.2); }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 14px; cursor: pointer; transition: border-color .15s; }
    .history-item:hover { border-color: var(--primary); }
    .history-meta { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
    .history-scores { display: flex; gap: 12px; font-size: 12px; font-weight: 600; }
    .history-scores span { opacity: .8; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<header>
  <div class="logo">⬡</div>
  <div>
    <h1>GenLayer Contract Scorer</h1>
    <p>Audit Intelligent Contracts with on-chain LLM consensus</p>
  </div>
  <span class="version-badge" style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--primary-dim);color:#a5b4fc;border:1px solid rgba(99,102,241,.25)">v0.3.0 SDK</span>
  <div class="header-right">
    <button class="btn btn-ghost btn-sm" id="connectBtn" onclick="connectWallet()">Connect Wallet</button>
    <span class="wallet-address hidden" id="walletAddr"></span>
  </div>
</header>

<div class="main">
  <div class="notice notice-err hidden" id="errorNotice"></div>

  <div class="card">
    <div class="card-title">Contract Source Code</div>
    <textarea id="sourceCode" placeholder="Paste the full source code of the contract you want to audit…"></textarea>
    <div class="toolbar">
      <button class="btn btn-primary" id="scoreBtn" onclick="scoreContract()">Score Contract</button>
      <button class="btn btn-ghost btn-sm" onclick="loadExample()">Load example (bank_vault.py)</button>
      <button class="btn btn-ghost btn-sm hidden" id="refreshBtn" onclick="refreshResult()">↻ Refresh result</button>
      <button class="btn btn-ghost btn-sm" id="historyBtn" onclick="loadHistory()">📋 History</button>
      <span class="audit-count" id="auditCount"></span>
    </div>
  </div>

  <div class="card hidden" id="logCard">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="card-title" style="margin:0">Output</div>
      <button class="btn btn-ghost btn-sm" onclick="clearLog()">Clear</button>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="card-title">Audit Result</div>
    <div id="verdictBadge" class="verdict hidden"></div>
    <div class="summary-text hidden" id="summaryText"></div>
    <div class="scores" id="scoresGrid">
      <div class="score-card">
        <div class="score-label">Overall</div>
        <div class="score-num" id="sOverall">—</div>
        <div class="score-bar-track"><div class="score-bar-fill" id="bOverall" style="width:0%"></div></div>
      </div>
      <div class="score-card">
        <div class="score-label">Code Quality</div>
        <div class="score-num" id="sQuality">—</div>
        <div class="score-bar-track"><div class="score-bar-fill" id="bQuality" style="width:0%"></div></div>
      </div>
      <div class="score-card">
        <div class="score-label">Security</div>
        <div class="score-num" id="sSecurity">—</div>
        <div class="score-bar-track"><div class="score-bar-fill" id="bSecurity" style="width:0%"></div></div>
      </div>
    </div>
    <div id="vulnSection">
      <div class="vuln-header">
        <div class="card-title" style="margin:0">Vulnerabilities</div>
        <div class="vuln-counts" id="vulnCounts"></div>
      </div>
      <div class="vuln-list" id="vulnList"></div>
    </div>
    <div class="no-vulns hidden" id="noVulns">✓ No vulnerabilities detected</div>
  </div>

  <div class="card hidden" id="historyCard">
    <div class="card-title">Audit History</div>
    <div class="history-list" id="historyList">
      <div style="color:var(--muted);font-size:13px">No audits yet.</div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'genlayer-js';
import { studionet } from 'genlayer-js/chains';

const CONTRACT_ADDRESS = '0x8c4eD32C437246148d295ca0c4950E51c5CD3469';

class App {
  walletAddress = null;
  pollTimer = null;

  constructor() {
    this.readClient = createClient({ chain: studionet });
    this.checkWallet();
  }

  async checkWallet() {
    if (window.ethereum) {
      const accounts = await window.ethereum.request({ method: 'eth_accounts' });
      if (accounts.length > 0) {
        this.setWallet(accounts[0]);
      }
    }
  }

  setWallet(address) {
    this.walletAddress = address;
    document.getElementById('connectBtn').classList.add('hidden');
    const addrEl = document.getElementById('walletAddr');
    addrEl.textContent = address.slice(0, 6) + '...' + address.slice(-4);
    addrEl.classList.remove('hidden');
  }

  async connectWallet() {
    try {
      if (!window.ethereum) {
        this.showError('No wallet found. Please install MetaMask.');
        return;
      }
      const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
      if (accounts.length > 0) {
        this.setWallet(accounts[0]);
        this.hideError();
      }
    } catch (err) {
      this.showError('Failed to connect wallet: ' + err.message);
    }
  }

  async loadExample() {
    try {
      const res = await fetch('/api/example');
      if (!res.ok) return this.showError('Could not load example file.');
      const { content } = await res.json();
      document.getElementById('sourceCode').value = content;
      this.hideError();
    } catch (err) {
      this.showError('Failed to load example: ' + err.message);
    }
  }

  async scoreContract() {
    const sourceCode = document.getElementById('sourceCode').value.trim();
    if (!sourceCode) return this.showError('Paste some source code first.');

    if (!this.walletAddress) {
      return this.showError('Please connect your wallet first.');
    }

    this.hideError();
    this.clearResult();
    this.showLog();
    this.setScoring(true);
    if (this.pollTimer) clearInterval(this.pollTimer);

    try {
      // Create client with wallet for signing
      this.writeClient = createClient({
        chain: studionet,
        account: this.walletAddress,
        provider: window.ethereum,
      });

      const txHash = await this.writeClient.writeContract({
        address: CONTRACT_ADDRESS,
        functionName: 'score_contract',
        args: [sourceCode],
        value: 0n,
      });

      this.appendLog(`→ Transaction submitted: ${txHash}`);
      this.appendLog(`→ Polling for status…`);

      let lastStatus = null;
      const poll = async () => {
        try {
          const tx = await this.readClient.getTransaction({ hash: txHash });
          const status = tx.statusName || tx.status?.name || String(tx.status);
          if (status !== lastStatus) {
            this.appendLog(`  status: ${status}`);
            lastStatus = status;
          }
          if (status === 'FINALIZED' || status === 'ACCEPTED') {
            clearInterval(this.pollTimer);
            this.appendLog('→ Transaction accepted. Reading result…');
            await this.loadLatestAudit();
            this.setScoring(false);
          } else if (['CANCELED', 'UNDETERMINED', 'LEADER_TIMEOUT', 'VALIDATORS_TIMEOUT'].includes(status)) {
            clearInterval(this.pollTimer);
            this.showError(`Transaction failed: ${status}`);
            this.setScoring(false);
          }
        } catch (e) {
          clearInterval(this.pollTimer);
          this.showError('Connection error: ' + e.message);
          this.setScoring(false);
        }
      };
      poll();
      this.pollTimer = setInterval(poll, 4000);
    } catch (err) {
      this.showError(err.message || String(err));
      this.setScoring(false);
    }
  }

  async loadLatestAudit() {
    if (!this.walletAddress) return;
    try {
      const raw = await this.readClient.readContract({
        address: CONTRACT_ADDRESS,
        functionName: 'get_my_audits',
        args: [],
      });
      const count = raw.count || 0;
      document.getElementById('auditCount').textContent = count > 0 ? `${count} audit${count !== 1 ? 's' : ''}` : '';
      if (count === 0) {
        this.hide('resultCard');
        return;
      }
      const latest = raw.audits[count - 1];
      this.renderResult(latest);
      this.show('resultCard');
    } catch (err) {
      console.log('Error loading audit:', err.message);
    }
  }

  async refreshResult() {
    await this.loadLatestAudit();
  }

  async loadHistory() {
    if (!this.walletAddress) {
      return this.showError('Please connect your wallet first.');
    }
    this.hideError();
    try {
      const raw = await this.readClient.readContract({
        address: CONTRACT_ADDRESS,
        functionName: 'get_my_audits',
        args: [],
      });
      const { audits, count } = raw;
      if (!count || count === 0) {
        this.show('historyCard');
        document.getElementById('historyList').innerHTML = '<div style="color:var(--muted);font-size:13px">No audits yet.</div>';
        return;
      }
      const container = document.getElementById('historyList');
      container.innerHTML = audits.slice().reverse().map((a, i) => `
        <div class="history-item" onclick='app.renderResult(${JSON.stringify(a).replace(/'/g, "&#39;")})'>
          <div class="history-meta">Audit #${a.id}</div>
          <div class="history-scores">
            <span style="color:${this.gradeColor(a.overall)}">Overall: ${a.overall ?? '?'}</span>
            <span style="color:${this.gradeColor(a.quality)}">Quality: ${a.quality ?? '?'}</span>
            <span style="color:${this.gradeColor(a.security)}">Security: ${a.security ?? '?'}</span>
          </div>
          ${a.summary ? `<div style="font-size:12px;color:var(--muted);margin-top:4px">${this.esc(a.summary)}</div>` : ''}
        </div>
      `).join('');
      this.show('historyCard');
    } catch (err) {
      this.showError('Failed to load history: ' + err.message);
    }
  }

  renderResult(data) {
    this.show('resultCard');
    if (data.summary) {
      document.getElementById('summaryText').textContent = data.summary;
      this.show('summaryText');
    } else {
      this.hide('summaryText');
    }
    if (data.overall !== null) {
      this.setScore('sOverall', 'bOverall', data.overall);
      this.setScore('sQuality', 'bQuality', data.quality);
      this.setScore('sSecurity', 'bSecurity', data.security);
      this.show('scoresGrid');
      const grade = this.gradeClass(data.overall);
      const labels = { good: '✓ Looks Good', mid: '⚠ Needs Attention', bad: '✕ High Risk' };
      const badge = document.getElementById('verdictBadge');
      badge.textContent = labels[grade];
      badge.className = `verdict ${grade}`;
      this.show('verdictBadge');
    } else {
      this.hide('scoresGrid');
      this.hide('verdictBadge');
    }
    const vulns = data.vulnerabilities || [];
    if (vulns.length) {
      const order = { critical: 0, medium: 1, low: 2 };
      vulns.sort((a, b) => (order[a.severity] ?? 3) - (order[b.severity] ?? 3));
      const counts = { critical: 0, medium: 0, low: 0 };
      vulns.forEach(v => { if (counts[v.severity] !== undefined) counts[v.severity]++; });
      document.getElementById('vulnCounts').innerHTML = ['critical','medium','low']
        .filter(s => counts[s] > 0)
        .map(s => `<span class="vuln-count-badge ${s}">${counts[s]} ${s}</span>`)
        .join('');
      document.getElementById('vulnList').innerHTML = vulns.map(v => `
        <div class="vuln-item ${this.esc(v.severity)}">
          <span class="vuln-badge">${this.esc(v.severity)}</span>
          <span class="vuln-desc">${this.esc(v.description)}</span>
        </div>
      `).join('');
      this.show('vulnSection');
      this.hide('noVulns');
    } else if (data.overall !== null) {
      this.hide('vulnSection');
      this.show('noVulns');
    }
  }

  setScore(numId, barId, score) {
    const cls = this.gradeClass(score);
    const numEl = document.getElementById(numId);
    numEl.textContent = score;
    numEl.className = `score-num ${cls}`;
    const barEl = document.getElementById(barId);
    barEl.style.width = `${score}%`;
    barEl.className = `score-bar-fill ${cls}`;
  }

  gradeClass(score) {
    return score >= 70 ? 'good' : score >= 40 ? 'mid' : 'bad';
  }

  gradeColor(score) {
    if (score == null) return 'var(--muted)';
    return score >= 70 ? 'var(--good)' : score >= 40 ? 'var(--warn)' : 'var(--bad)';
  }

  clearResult() {
    this.hide('resultCard');
    this.hide('verdictBadge');
    this.hide('summaryText');
    this.hide('noVulns');
    document.getElementById('vulnList').innerHTML = '';
    document.getElementById('vulnCounts').innerHTML = '';
    this.show('vulnSection');
    this.show('scoresGrid');
  }

  showLog() {
    this.show('logCard');
    document.getElementById('log').innerHTML = '';
  }

  clearLog() {
    document.getElementById('log').innerHTML = '';
    this.hide('logCard');
  }

  appendLog(text) {
    const box = document.getElementById('log');
    const line = document.createElement('div');
    line.textContent = text;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  setScoring(on) {
    const btn = document.getElementById('scoreBtn');
    btn.disabled = on;
    btn.innerHTML = on ? `<div class="spinner"></div> Scoring…` : 'Score Contract';
  }

  showError(msg) {
    const el = document.getElementById('errorNotice');
    el.innerHTML = `<span>✕</span><span>${this.esc(msg)}</span>`;
    el.classList.remove('hidden');
  }

  hideError() {
    this.hide('errorNotice');
  }

  show(id) { document.getElementById(id).classList.remove('hidden'); }
  hide(id) { document.getElementById(id).classList.add('hidden'); }
  esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
}

window.app = new App();

// Expose methods at window level for HTML onclick handlers
window.connectWallet = () => window.app.connectWallet();
window.scoreContract = () => window.app.scoreContract();
window.loadExample = () => window.app.loadExample();
window.refreshResult = () => window.app.refreshResult();
window.loadHistory = () => window.app.loadHistory();
window.clearLog = () => window.app.clearLog();
</script>
</body>
</html>
