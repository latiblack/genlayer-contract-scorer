<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GenLayer Contract Scorer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0f172a; --surface: #1e293b; --raised: #293548; --border: #334155; --primary: #6366f1; --primary-dim: rgba(99,102,241,.12); --text: #f1f5f9; --muted: #94a3b8; --good: #22c55e; --warn: #eab308; --bad: #ef4444; --mono: 'Cascadia Code','Fira Code','Consolas',monospace; --sans: 'Segoe UI',system-ui,-apple-system,sans-serif; --r: 8px; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; gap: 12px; }
    .logo { width: 34px; height: 34px; background: var(--primary); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    header h1 { font-size: 16px; font-weight: 600; }
    header p { font-size: 12px; color: var(--muted); }
    .main { max-width: 860px; margin: 32px auto; padding: 0 24px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
    .card-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 14px; }
    textarea { width: 100%; height: 280px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; color: var(--text); font-family: var(--mono); font-size: 12.5px; line-height: 1.65; resize: vertical; outline: none; }
    textarea:focus { border-color: var(--primary); }
    .toolbar { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--r); border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:not(:disabled):hover { background: #818cf8; }
    .btn-ghost { background: var(--raised); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:not(:disabled):hover { background: var(--border); }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .spinner { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: spin .65s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .notice { padding: 12px 16px; border-radius: var(--r); font-size: 13px; display: flex; align-items: flex-start; gap: 10px; }
    .notice-err { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.25); color: #fca5a5; }
    .log { background: #080f1a; border: 1px solid var(--border); border-radius: var(--r); padding: 14px; font-family: var(--mono); font-size: 12px; line-height: 1.75; max-height: 220px; overflow-y: auto; color: #7dd3fc; }
    .scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
    .score-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 16px 14px; }
    .score-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
    .score-num { font-size: 42px; font-weight: 700; line-height: 1; margin-bottom: 10px; }
    .score-num.good { color: var(--good); }
    .score-num.mid { color: var(--warn); }
    .score-num.bad { color: var(--bad); }
    .score-bar-track { height: 4px; background: var(--raised); border-radius: 99px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 99px; transition: width .6s ease; }
    .score-bar-fill.good { background: var(--good); }
    .score-bar-fill.mid { background: var(--warn); }
    .score-bar-fill.bad { background: var(--bad); }
    .summary-text { font-size: 13px; color: var(--muted); margin-bottom: 16px; font-style: italic; padding: 8px 12px; background: var(--bg); border-radius: var(--r); border-left: 3px solid var(--primary); }
    .verdict { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px; font-size: 12px; font-weight: 600; letter-spacing: .04em; margin-bottom: 20px; }
    .verdict.good { background: rgba(34,197,94,.12); color: #86efac; border: 1px solid rgba(34,197,94,.25); }
    .verdict.mid { background: rgba(234,179,8,.12); color: #fde68a; border: 1px solid rgba(234,179,8,.25); }
    .verdict.bad { background: rgba(239,68,68,.12); color: #fca5a5; border: 1px solid rgba(239,68,68,.25); }
    .vuln-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .vuln-counts { display: flex; gap: 8px; }
    .vuln-count-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
    .vuln-count-badge.critical { background: rgba(239,68,68,.15); color: #fca5a5; }
    .vuln-count-badge.medium { background: rgba(234,179,8,.15); color: #fde68a; }
    .vuln-count-badge.low { background: rgba(34,197,94,.15); color: #bbf7d0; }
    .vuln-list { display: flex; flex-direction: column; gap: 6px; }
    .vuln-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: var(--bg); border-radius: var(--r); border-left: 3px solid transparent; }
    .vuln-item.critical { border-color: var(--bad); }
    .vuln-item.medium { border-color: var(--warn); }
    .vuln-item.low { border-color: var(--good); }
    .vuln-badge { flex-shrink: 0; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
    .critical .vuln-badge { background: rgba(239,68,68,.18); color: #fca5a5; }
    .medium .vuln-badge { background: rgba(234,179,8,.18); color: #fde68a; }
    .low .vuln-badge { background: rgba(34,197,94,.18); color: #bbf7d0; }
    .vuln-desc { font-size: 13px; line-height: 1.4; }
    .no-vulns { color: var(--good); font-size: 13px; padding: 10px 14px; background: rgba(34,197,94,.06); border-radius: var(--r); border: 1px solid rgba(34,197,94,.2); }
    .progress-bar { height: 4px; background: var(--raised); border-radius: 99px; overflow: hidden; margin: 10px 0; }
    .progress-fill { height: 100%; background: var(--primary); border-radius: 99px; transition: width .3s ease; }
    .progress-stages { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 4px; }
    .stage { opacity: 0.5; }
    .stage.active { opacity: 1; color: var(--primary); }
    .stage.done { opacity: 1; color: var(--good); }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<header>
  <div class="logo">⬡</div>
  <div>
    <h1>GenLayer Contract Scorer</h1>
    <p>Audit Intelligent Contracts with on-chain LLM consensus</p>
  </div>
  <span style="font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px;background:var(--primary-dim);color:#a5b4fc;border:1px solid rgba(99,102,241,.25)">v0.3.0 SDK</span>
</header>

<div class="main">
  <div class="notice notice-err hidden" id="errorNotice"></div>

  <div class="card">
    <div class="card-title">Contract Source Code</div>
    <textarea id="sourceCode" placeholder="Paste the full source code of the contract you want to audit…"></textarea>
    <div class="toolbar">
      <button class="btn btn-primary" id="scoreBtn" onclick="scoreContract()">Score Contract</button>
      <button class="btn btn-ghost btn-sm" onclick="loadExample()">Load example</button>
    </div>
    
    <div class="card hidden" id="progressCard" style="margin-top:15px">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-stages">
        <span class="stage" id="stage1">Submit</span>
        <span class="stage" id="stage2">LLM Processing</span>
        <span class="stage" id="stage3">Validation</span>
        <span class="stage" id="stage4">Finalized</span>
      </div>
    </div>
  </div>

  <div class="card hidden" id="logCard">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div class="card-title" style="margin:0">Output</div>
      <button class="btn btn-ghost btn-sm" onclick="clearLog()">Clear</button>
    </div>
    <div class="log" id="log"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <div class="card-title">Audit Result</div>
    <div id="verdictBadge" class="verdict hidden"></div>
    <div class="summary-text hidden" id="summaryText"></div>
    <div class="scores" id="scoresGrid">
      <div class="score-card"><div class="score-label">Overall</div><div class="score-num" id="sOverall">—</div><div class="score-bar-track"><div class="score-bar-fill" id="bOverall" style="width:0%"></div></div></div>
      <div class="score-card"><div class="score-label">Quality</div><div class="score-num" id="sQuality">—</div><div class="score-bar-track"><div class="score-bar-fill" id="bQuality" style="width:0%"></div></div></div>
      <div class="score-card"><div class="score-label">Security</div><div class="score-num" id="sSecurity">—</div><div class="score-bar-track"><div class="score-bar-fill" id="bSecurity" style="width:0%"></div></div></div>
    </div>
    <div id="vulnSection">
      <div class="vuln-header">
        <div class="card-title" style="margin:0">Vulnerabilities</div>
        <div class="vuln-counts" id="vulnCounts"></div>
      </div>
      <div class="vuln-list" id="vulnList"></div>
    </div>
    <div class="no-vulns hidden" id="noVulns">✓ No vulnerabilities detected</div>
  </div>
</div>

<script>
var pollTimer = null;

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function gradeClass(score) { return score >= 70 ? 'good' : score >= 40 ? 'mid' : 'bad'; }
function gradeColor(score) { return score == null ? 'var(--muted)' : score >= 70 ? 'var(--good)' : score >= 40 ? 'var(--warn)' : 'var(--bad)'; }

function updateProgress(stage) {
  document.getElementById('progressFill').style.width = (stage * 25) + '%';
  for (var i = 1; i <= 4; i++) {
    var el = document.getElementById('stage' + i);
    el.className = 'stage';
    if (i < stage) el.className = 'stage done';
    else if (i === stage) el.className = 'stage active';
  }
}

async function loadExample() {
  var res = await fetch('/api/example');
  var data = await res.json();
  document.getElementById('sourceCode').value = data.content;
  hideError();
}

async function scoreContract() {
  var sourceCode = document.getElementById('sourceCode').value.trim();
  if (!sourceCode) return showError('Paste some source code first.');

  hideError();
  clearResult();
  showLog();
  setScoring(true);
  if (pollTimer) clearInterval(pollTimer);
  
  show('progressCard');
  updateProgress(1);

  try {
    var res = await fetch('/api/score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sourceCode: sourceCode })
    });
    var data = await res.json();
    if (!res.ok) throw new Error(data.error);
    
    appendLog('→ TX: ' + data.txHash);
    updateProgress(2);
    
    var poll = async function() {
      var r = await fetch('/api/status/' + data.txHash);
      var result = await r.json();
      
      // Map status to stages
      if (result.status === 'PENDING' || result.status === 'ACCEPTED') {
        updateProgress(2);
      } else if (result.status === 'COMMITTED' || result.status === 'VALIDATING') {
        updateProgress(3);
      } else if (result.status === 'FINALIZED') {
        updateProgress(4);
      }
      
      if (result.done) {
        clearInterval(pollTimer);
        updateProgress(4);
        if (result.error) showError(result.error);
        else if (result.result) {
          appendLog('→ Done!');
          renderResult(result.result);
        }
        setScoring(false);
      }
    };
    poll();
    pollTimer = setInterval(poll, 4000);
  } catch (err) {
    hide('progressCard');
    showError(err.message);
    setScoring(false);
  }
}

function renderResult(data) {
  show('resultCard');
  if (data.summary) {
    document.getElementById('summaryText').textContent = data.summary;
    show('summaryText');
  } else hide('summaryText');
  
  if (data.overall !== null) {
    setScore('sOverall', 'bOverall', data.overall);
    setScore('sQuality', 'bQuality', data.quality);
    setScore('sSecurity', 'bSecurity', data.security);
    show('scoresGrid');
    var cls = gradeClass(data.overall);
    var labels = { good: '✓ Looks Good', mid: '⚠ Needs Attention', bad: '✕ High Risk' };
    var badge = document.getElementById('verdictBadge');
    badge.textContent = labels[cls];
    badge.className = 'verdict ' + cls;
    show('verdictBadge');
  } else {
    hide('scoresGrid');
    hide('verdictBadge');
  }
  
  var vulns = data.vulnerabilities || [];
  if (typeof vulns === 'string') {
    try { vulns = JSON.parse(vulns); } catch(e) { vulns = []; }
  }
  if (vulns && vulns.length) {
    vulns.sort(function(a,b) { var order = {critical:0, medium:1, low:2}; return (order[a.severity]||3) - (order[b.severity]||3); });
    var counts = {critical:0, medium:0, low:0};
    vulns.forEach(function(v) { if (counts[v.severity] !== undefined) counts[v.severity]++; });
    document.getElementById('vulnCounts').innerHTML = ['critical','medium','low'].filter(function(s) { return counts[s] > 0; }).map(function(s) { return '<span class="vuln-count-badge '+s+'">'+counts[s]+' '+s+'</span>'; }).join('');
    document.getElementById('vulnList').innerHTML = vulns.map(function(v) { return '<div class="vuln-item '+(v.severity||'low')+'"><span class="vuln-badge">'+(v.severity||'low')+'</span><span class="vuln-desc">'+esc(v.description||'')+'</span></div>'; }).join('');
    show('vulnSection');
    hide('noVulns');
  } else if (data.overall !== null) {
    hide('vulnSection');
    show('noVulns');
  }
}

function setScore(numId, barId, score) {
  var cls = gradeClass(score);
  document.getElementById(numId).textContent = score;
  document.getElementById(numId).className = 'score-num ' + cls;
  document.getElementById(barId).style.width = score + '%';
  document.getElementById(barId).className = 'score-bar-fill ' + cls;
}

function clearResult() {
  hide('resultCard');
  hide('verdictBadge');
  hide('summaryText');
  hide('noVulns');
  hide('progressCard');
}

function showLog() { show('logCard'); document.getElementById('log').innerHTML = ''; }
function clearLog() { document.getElementById('log').innerHTML = ''; hide('logCard'); }
function appendLog(text) {
  var box = document.getElementById('log');
  var line = document.createElement('div');
  line.textContent = text;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function setScoring(on) {
  document.getElementById('scoreBtn').disabled = on;
  document.getElementById('scoreBtn').innerHTML = on ? '<div class="spinner"></div> Scoring…' : 'Score Contract';
}

function showError(msg) {
  var el = document.getElementById('errorNotice');
  el.innerHTML = '<span>✕</span><span>' + esc(msg) + '</span>';
  el.classList.remove('hidden');
}
function hideError() { hide('errorNotice'); }
</script>
</body>
</html>
